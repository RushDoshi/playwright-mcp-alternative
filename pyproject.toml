[project]
name = "playwright-mcp-alternative"
version = "0.1.0"
description = "AI-native QA automation host: generates and runs Playwright UI tests from a Jira ticket via a closed action-DSL — a safer alternative to the Playwright MCP, no Anthropic API key required."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
